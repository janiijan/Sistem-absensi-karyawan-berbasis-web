services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: sepa-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
    networks:
      - sepa
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8080
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: sepa_absensi
      DB_USERNAME: sepa
      DB_PASSWORD: sepa_secret
      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: database

  nginx:
    image: nginx:1.27-alpine
    container_name: sepa-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./backend:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - sepa
    depends_on:
      - app

  mysql:
    image: mysql:8.4
    container_name: sepa-mysql
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      MYSQL_DATABASE: sepa_absensi
      MYSQL_USER: sepa
      MYSQL_PASSWORD: sepa_secret
      MYSQL_ROOT_PASSWORD: root_secret
    volumes:
      - sepa_mysql_data:/var/lib/mysql
    networks:
      - sepa
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot_secret"]
      interval: 5s
      timeout: 5s
      retries: 20

networks:
  sepa:
    driver: bridge

volumes:
  sepa_mysql_data:
